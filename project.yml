name: OpenShelfReader
options:
  bundleIdPrefix: org.opennorms
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# ReaderCore is the Swift package in this same repository (Package.swift);
# libgit2 (SwiftPM build) sits behind the GitSyncEngine seam.
packages:
  ReaderCorePkg:
    path: .
  libgit2:
    url: https://github.com/ibrahimcetin/libgit2
    exactVersion: 1.9.2

targets:
  OpenShelfReader:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OpenShelf Reader
        UILaunchStoryboardName: ""
        BGTaskSchedulerPermittedIdentifiers:
          - org.opennorms.openshelf-reader.refresh
    dependencies:
      - package: ReaderCorePkg
        product: ReaderCore
      - package: libgit2
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opennorms.openshelf-reader
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
