<svg xmlns="http://www.w3.org/2000/svg" width="328" height="270" viewBox="92 140 328 270">
  <title>OpenShelf mark</title>
  <!-- Transparent ground. The shelf line uses currentColor so the mark
       works on dark and light; set `color` where it is embedded. -->
  <rect x="124" y="150" width="84" height="234" rx="10" fill="#1f6b60"/>
  <rect x="220" y="196" width="68" height="188" rx="10" fill="#8a3a32"/>
  <g transform="rotate(-14 335 384)">
    <rect x="335" y="176" width="64" height="208" rx="10" fill="#e8a33d"/>
  </g>
  <rect x="92" y="384" width="328" height="16" rx="8" fill="currentColor"/>
</svg>
